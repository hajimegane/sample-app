# 本番への配布
#
# **不可逆な操作。人が発火する**（定義v0.6 §10）。
# workflow_dispatch のみで、push では起動しない。実績が積まれても
# 自動化しない領域（policy/boundaries.yaml の distribute:production は fixed）。
#
# **起動は kit の adapters/fire.ts から行う。** これが唯一の正規経路で、
# Runner ポートを経由してこの workflow を起動する（ADR-0015）。
# GitHub の画面から直接起動することもできてしまうが、その場合は
# テレメトリに記録が残らない。
#
# 前提: CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID がリポジトリの
# secret に設定されていること。未設定のままでは失敗する。
name: distribute-production

# 起動しても、production 環境の必須レビュアーが承認するまで進まない。
#
# 以前は confirm という入力を要求していたが、環境の保護ルールと重複していた。
# しかも起動するのは Runner ポート経由のエージェントなので、エージェント自身が
# 「release」と打つことになり、確認としての意味を失っていた。弱いほうを外した。
on:
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gates before distributing
        run: npm run check
      - name: distribute to production
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
