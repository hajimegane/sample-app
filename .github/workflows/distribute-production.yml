# 本番への配布
#
# **不可逆な操作。人が発火する**（定義v0.6 §10）。
# workflow_dispatch のみで、push では起動しない。実績が積まれても
# 自動化しない領域（policy/boundaries.yaml の distribute:production は fixed）。
name: distribute-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 本番に配布する場合は release と入力
        required: true

jobs:
  production:
    if: inputs.confirm == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: gates before distributing
        run: npm run check
      - name: distribute to production
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
