# 検証環境への配布
#
# **戻せる操作。人の承認を挟まない**（境界 `distribute:verify` は full-delegation）。
# 利用者がおらず、再配布で消える。ここに人の判断を挟むと、判断の要らない操作の
# ために内側ループへ人を戻すことになる。
#
# **起動は kit の Runner ポートから行う。** エージェントは Cloudflare の資格情報を
# 持たないので、この workflow を通す以外に検証環境へ到達する手段がない。
# 判定ではなく能力の側で塞いでいる（ADR-0012）。
#
# 見た目だけを見たいときはここではなく試写を使う。試写は資格情報なしで
# `wrangler deploy --temporary` に出す使い捨ての宛先で、60分で消える。
# ここは外部接続を含めた動作確認の場所。
name: distribute-verify

# `environment: verify` は保護ルールを持たない。secret を読む範囲を
# 分けるためだけに宣言している — 本番のトークンは production 環境の
# secret にあり、この job からは読めない。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: gates before distributing
        run: npm run check

      # スキーマの変更を含む配布で、配布だけ先に通ると壊れる。
      # 追加的な変更のみを想定している（`modify:schema-additive`）。
      - name: migrate
        run: npx wrangler d1 migrations apply DB --env verify --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: distribute to verify
        run: npx wrangler deploy --env verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
